      (function() {
        // 0. Default to dark mode (respect explicit 'light' if stored, otherwise dark)

          var savedTheme = localStorage.getItem('dn-theme');
          if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {
          document.documentElement.classList.add('dark');
        }
